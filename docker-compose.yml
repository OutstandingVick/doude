# Feasibility3D — engine + app together, with a persistent data volume.
#
#   cp .env.example .env   # then fill in COOKIE_SECRET + ADMIN_PASSWORD
#   docker compose up -d --build
#
# The database and evidence live on the `data` volume, so they survive
# `docker compose up --build` / container replacement.

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: feasibility3d-engine
    environment:
      # Data paths (on the volume).
      FEASIBILITY3D_DB: /data/feasibility3d.db
      FEASIBILITY3D_EVIDENCE: /data/evidence
      FEASIBILITY3D_REPORTS: /data/reports
      # production = refuse to start without COOKIE_SECRET + ADMIN_PASSWORD.
      APP_ENV: ${APP_ENV:-production}
      # Auth. COOKIE_SECRET and ADMIN_PASSWORD are required (fail fast if unset).
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # The browser reaches the engine only through the app's /api proxy, so
      # the session cookie is first-party: SameSite=Lax + Secure.
      # Set COOKIE_SECURE=false only for plain-http local testing.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: lax
    # No public port: only the app talks to the engine (internal network).
    expose:
      - "8000"
    volumes:
      - data:/data
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        # Server-side engine URL for the /api/* proxy (internal hostname).
        ENGINE_URL: http://engine:8000
    container_name: feasibility3d-app
    environment:
      NODE_ENV: production
      ENGINE_URL: http://engine:8000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  data:
